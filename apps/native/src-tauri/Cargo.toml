[package]
name = "e2ee-chat-native"
version = "0.1.1"
description = "Shared native shell for Private Base"
edition = "2021"
rust-version = "1.90"

[lib]
name = "e2ee_chat_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
serde_json = "=1.0.154"
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-clipboard-manager = "=2.5.0"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-fs = "=2.7.1"
tauri-plugin-notification = "=2.8.1"
tauri-plugin-opener = "=2.7.3"

[target.'cfg(windows)'.dependencies]
base64 = "=0.22.1"
ring = "=0.17.14"
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-single-instance = "=2.5.5"
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["sync", "time"] }
windows = { version = "=0.62.2", features = ["Security_Credentials", "Security_Cryptography_Core", "Storage_Streams", "Wdk_System_SystemServices", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
zeroize = "=1.9.1"

[dev-dependencies]
base64 = "=0.22.1"
ring = "=0.17.14"
tempfile = "=3.27.0"
zeroize = "=1.9.1"
# Type-check the Windows command/wiring in host tests without a Windows SDK.
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-single-instance = "=2.5.5"
tokio = { version = "=1.54.1", features = ["sync", "time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
getrandom = "=0.4.3"
reqwest = { version = "=0.13.4", default-features = false }
semver = { version = "=1.0.28", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"
tauri-plugin-process = "=2.4.0"
tauri-plugin-updater = "=2.14.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dev-dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }
tauri = { version = "=2.12.5", features = ["test"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
