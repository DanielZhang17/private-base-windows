name: Native Windows

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile (debug = unsigned dev build, release = release NSIS installer; updater signing happens offline)
        type: choice
        options: [debug, release]
        default: debug
  push:
    branches:
      - native/windows

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PROFILE: ${{ inputs.profile || 'debug' }}
      VITE_API_BASE_URL: https://chat.718788.xyz
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri -> target
          key: ${{ env.PROFILE }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned debug executable and NSIS installer
        if: env.PROFILE == 'debug'
        run: pnpm native:build --debug --config src-tauri/ci-no-updater.conf.json

      - name: Build release NSIS installer (updater signature is added offline)
        if: env.PROFILE == 'release'
        run: pnpm native:build --config src-tauri/ci-no-updater.conf.json

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v7
        with:
          name: private-base-windows-x64-${{ env.PROFILE }}-nsis
          path: apps/native/src-tauri/target/${{ env.PROFILE }}/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
